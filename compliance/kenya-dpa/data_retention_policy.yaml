breach_notification:
  odpc_contact: complaints@odpc.go.ke
  odpc_deadline_hours: 72
  playbook: compliance/playbooks/breach_response.md
dpo_email: security@sorabbyngo.co.ke
effective_date: '2026-01-01'
organization: Sorabbyngo Labs
retention_periods:
  audit_logs:
    legal_basis: Kenya DPA 2019, Section 41
    retention_years: 3
  chw_registry:
    legal_basis: Ministry of Health Kenya guidelines
    retention_years: 10
  jwt_tokens:
    retention_hours: 24
    storage: In-memory — not persisted
  patient_records:
    legal_basis: Kenya Health Act 2017, Section 103
    retention_years: 7
    storage: PostgreSQL — AES-256 encrypted at rest
  vitals_timeseries:
    retention_years: 5
    storage: InfluxDB — AES-256 encrypted at rest, retention policy automatic
