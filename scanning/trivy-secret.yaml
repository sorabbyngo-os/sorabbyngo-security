rules:
  - id: sorabbyngo-jwt-secret
    category: general
    title: Hardcoded JWT Secret
    severity: CRITICAL
    regex: "JWT_SECRET\\s*=\\s*['\"][^'\"]{8,}['\"]"
  - id: sorabbyngo-db-password
    category: general
    title: Hardcoded DB Password
    severity: CRITICAL
    regex: "(?i)(DB_PASSWORD|DATABASE_URL|POSTGRES_PASSWORD)\\s*=\\s*['\"][^'\"]{4,}['\"]"
  - id: sorabbyngo-anthropic-key
    category: api-key
    title: Anthropic API Key
    severity: CRITICAL
    regex: "sk-ant-[a-zA-Z0-9]{32,}"
  - id: sorabbyngo-nats-creds
    category: general
    title: NATS Credentials
    severity: HIGH
    regex: "(?i)(NATS_USER|NATS_PASSWORD|NATS_TOKEN)\\s*=\\s*['\"][^'\"]{4,}['\"]"
